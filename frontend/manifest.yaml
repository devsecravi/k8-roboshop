apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend
  namespace: roboshop
  labels:
    project: roboshop 
    environment: dev
    tier: frontend
# data:
#   MONGO: "true"
#   MONGO_URL: "mongodb://mongodb:27017/catalogue"
  
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: roboshop
  labels:
    project: roboshop 
    environment: dev
    tier: frontend

spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      environment: dev
      tier: frontend
  # this is pod defination, pod is subset of replicaset
  template:
    metadata:
      labels:
        project: roboshop
        environment: dev
        tier: frontend
    spec:
      containers:
      - name: frontend
        image: ravid145/frontend:1.0.0
        resources:
         requests:
           cpu: "100m"
           memory: "128Mi"
         limits: 
           cpu: "100m"
           memory: "128Mi"
        readinessProbe:
          tcpSocket: 
             port: 8080
          failureThreshold: 
          periodSeconds: 10
          initialDelaySeconds: 15
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          failureThreshold: 2
          periodSeconds: 10

        envFrom:
        - configMapRef:
            name: frontend
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: roboshop
  labels:
    project: roboshop
    environment: dev
    tier: frontend
spec:
  selector:
    project: roboshop
    environment: dev
    tier: frontend
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
  