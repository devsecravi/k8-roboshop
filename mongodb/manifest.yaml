apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: roboshop
  labels:
    project: roboshop 
    environment: dev
    tier: db
  annotations:
    kubernetes.io/change-cause: "moving  to alpine3.23-perl"

spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      environment: dev
      tier: db
  # this is pod defination, pod is subset of replicaset
  template:
    metadata:
      labels:
        project: roboshop
        environment: dev
        tier: db
    spec:
      containers:
      - name: mongodb
        image: ravid145/mongodb:1.0.0
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: roboshop
  labels:
    project: roboshop
    environment: dev
    tier: db
spec:
  selector:
    project: roboshop
    environment: dev
    tier: db
  ports:
  - protocol: TCP
    port: 27017
    targetPort: 27017
  